grassy_glide=仿佛在地面上滑行般地攻击对手。在青草场地上，必定能够先制攻击。
rising_voltage=用从地面升腾而起的电击进行攻击。当对手处于电气场地上时，招式威力会变成２倍。
terrain_pulse=借助场地的力量进行攻击。视使出招式时场地状态不同，招式的属性和威力会有所变化。
skitter_smack=从对手背后爬近后进行攻击。会降低对手的特攻。
burning_jealousy=用嫉妒的能量攻击对手。会让在该回合内能力有所提高的宝可梦陷入灼伤状态。
lash_out=攻击对手以发泄对其感到的恼怒情绪。如果在该回合内自身能力遭到降低，招式的威力会变成２倍。
poltergeist=操纵对手的持有物进行攻击。当对手没有携带道具时，使出此招式时便会失败。
string_shot=用口中吐出的丝缠绕对手，从而大幅降低对手的速度。
corrosive_gas=用具有强酸性的气体包裹住自己周围所有的宝可梦，并融化其所携带的道具。
coaching=通过进行正确合理的指导，提高我方全员的攻击和防御。
flip_turn=在攻击之后急速返回，和后备宝可梦进行替换。
triple_axel=连续３次踢对手进行攻击。每踢中一次，威力就会提高。
dual_wingbeat=将翅膀撞向对手进行攻击。连续２次给予伤害。
scorching_sands=将滚烫的沙子砸向对手进行攻击。有时会让对手陷入灼伤状态。
jungle_healing=与丛林融为一体，回复自己和场上同伴的ＨＰ和状态。
wicked_blow=将恶之流派修炼至大成的猛烈一击。必定会击中要害。
surging_strikes=将水之流派修炼至大成的仿若行云流水般的３次连击。必定会击中要害。
thunder_cage=将对手困在电流四溅的囚笼中，在４～５回合内进行攻击。
dragon_rage=无法使用这个招式。虽然忘记之后就再也想不起来了，但还是建议忘记这个招式。
dragon_energy=把生命力转换为力量攻击对手。自己的ＨＰ越少，招式的威力越小。
