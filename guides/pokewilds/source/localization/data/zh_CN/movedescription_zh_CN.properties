max_rockfall=极巨化宝可梦使出的岩石属性攻击。可在５回合内卷起沙暴。
max_quake=极巨化宝可梦使出的地面属性攻击。会提高我方的特防。
max_darkness=极巨化宝可梦使出的恶属性攻击。会降低对手的特防。
max_overgrowth=极巨化宝可梦使出的草属性攻击。可在５回合内将脚下变成青草场地。
max_steelspike=极巨化宝可梦使出的钢属性攻击。会提高我方的防御。
clangorous_soul=削减少许自己的ＨＰ，使所有能力都提高。
body_press=用身体撞向对手进行攻击。防御越高，给予的伤害就越高。
decorate=通过装饰，大幅提高对方的攻击和特攻。
drum_beating=用鼓点来控制鼓的根部进行攻击，从而降低对手的速度。
snap_trap=使用捕兽夹，在４～５回合内，夹住对手进行攻击。
stun_spore=撒出麻痹粉，从而让对手陷入麻痹状态。
pyro_ball=点燃小石子，形成火球攻击对手。有时会使对手陷入灼伤状态。
