# PokeAPI current Simplified Chinese move descriptions, fixed commit bc92d3b
pound=使用长长的尾巴或手等拍打对手进行攻击。
scratch=用坚硬且无比锋利的爪子抓对手进行攻击。
teleport=当有后备宝可梦在时，如果使用就可以进行替换。野生的宝可梦会逃走。
night_shade=显示恐怖幻影，只给予对手和自己等级相同的伤害。
mimic=可以将对手最后使用的招式，在战斗内变成自己的招式。
screech=发出不由自主想要捂起耳朵的刺耳声，从而大幅降低对手的防御。
double_team=通过快速移动来制造分身，扰乱对手，从而提高闪避率。
recover=让细胞再生，从而回复自己最大ＨＰ的一半。
harden=全身使劲，让身体变硬，从而提高自己的防御。
minimize=蜷缩身体显得很小，从而大幅提高自己的闪避率。
smokescreen=向对手喷出烟或墨汁等，从而降低对手的命中率。
confuse_ray=显示奇怪的光，扰乱对手。使对手混乱。
vice_grip=将对手从两侧夹住，给予伤害。
withdraw=缩入壳里保护身体，从而提高自己的防御。
defense_curl=将身体蜷曲变圆，从而提高自己的防御。
barrier=无法使用这个招式。虽然忘记之后就再也想不起来了，但还是建议忘记这个招式。
light_screen=利用神奇的墙壁，在５回合内减弱从对手那里受到的特殊攻击的伤害。
haze=升起黑雾，将正在场上战斗的全体宝可梦的能力变回原点。
reflect=利用神奇的墙壁，在５回合内减弱从对手那里受到的物理攻击的伤害。
focus_energy=深深地吸口气，集中精神。自己的攻击会变得容易击中要害。
bide=无法使用这个招式。虽然忘记之后就再也想不起来了，但还是建议忘记这个招式。
