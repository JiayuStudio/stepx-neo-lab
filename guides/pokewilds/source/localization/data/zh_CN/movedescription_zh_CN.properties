scale_shot=发射鳞片进行攻击。连续攻击２～５次。速度会提高但防御会降低。
ice_punch=用充满寒气的拳头攻击对手。有时会让对手陷入冰冻状态。
petal_dance=在２～３回合内，散落花瓣攻击对手。之后自己会陷入混乱。
meteor_beam=第１回合聚集宇宙之力提高特攻，第２回合攻击对手。
