astral_barrage=用大量的小灵体向对手发起攻击。
eerie_spell=用强大的精神力量攻击。让对手最后使用的招式减少３ＰＰ。
fire_spin=将对手困在激烈的火焰旋涡中，在４～５回合内进行攻击。
thunder_shock=发出电流刺激对手进行攻击。有时会让对手陷入麻痹状态。
thunderbolt=向对手发出强力电击进行攻击。有时会让对手陷入麻痹状态。
thunder_wave=向对手发出微弱的电击，从而让对手陷入麻痹状态。
thunder=向对手劈下暴雷进行攻击。有时会让对手陷入麻痹状态。
rock_throw=拿起小岩石，投掷对手进行攻击。
earthquake=利用地震的冲击，攻击自己周围所有的宝可梦。
thunder_punch=用充满电流的拳头攻击对手。有时会让对手陷入麻痹状态。
fissure=让对手掉落于地裂的裂缝中进行攻击。只要命中就会一击濒死。
dig=第１回合钻入，第２回合攻击对手。
toxic=让对手陷入剧毒状态。随着回合的推进，中毒伤害会增加。
confusion=向对手发送微弱的念力进行攻击。有时会使对手混乱。
psychic=向对手发送强大的念力进行攻击。有时会降低对手的特防。
hypnosis=施以诱导睡意的暗示，让对手陷入睡眠状态。
meditate=无法使用这个招式。虽然忘记之后就再也想不起来了，但还是建议忘记这个招式。
agility=让身体放松变得轻盈，以便高速移动。大幅提高自己的速度。
quick_attack=以迅雷不及掩耳之势扑向对手。必定能够先制攻击。
rage=无法使用这个招式。虽然忘记之后就再也想不起来了，但还是建议忘记这个招式。
