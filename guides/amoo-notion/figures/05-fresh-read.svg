<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1009" role="img" aria-labelledby="title desc">
<title id="title">用新值证明这一次读过</title><desc id="desc">校验词是测试标记，不是密码。。你在 Notion 修改内容：换版本、随机词和一条非敏感偏好；新开 Amoo 聊天：只发页面链接和读取要求，不给版本号、随机词的正确答案；查看真实调用与回执：工具、时间、版本、校验词、完整性；与你的页面逐项比对：新值一致才有本轮读取证据。操作示意，非实机截图。</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f3f8f7"/><stop offset="1" stop-color="#eaf1ef"/></linearGradient></defs>
<rect width="720" height="1009" rx="28" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="40" y="36" width="8" height="34" rx="4" fill="#147b70"/>
<text x="62" y="61" font-size="21" font-weight="650" fill="#147b70">STEPX NEO 研究所  /  图 05</text>
<text x="40" y="121" font-size="38" font-weight="700" fill="#173831">用新值证明这一次读过</text>
<text x="40" y="169" font-size="25" font-weight="400" fill="#344850">校验词是测试标记，不是密码。</text>
